name: Tests

on:
  push:
    branches: [2.0, 3.0, main, master]
  pull_request:
    branches: [2.0, 3.0, main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.1, 8.2, 8.3]
        laravel: [10.*, 11.*, 12.*]
        include:
          - laravel: 10.*
            testbench: 8.*
          - laravel: 11.*
            testbench: 9.*
          - laravel: 12.*
            testbench: 10.*
        exclude:
          - php: 8.1
            laravel: 11.*
          - php: 8.1
            laravel: 12.*

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit

  # Same job as street-orb/spectre-orb's composer_audit: audits the committed composer.lock.
  # COMPOSER_NO_SECURITY_BLOCKING stops Composer 2.9+ silently skipping
  # vulnerable versions during update, so the audit sees what the composer.json
  # constraints actually allow.
  composer-audit:
    runs-on: ubuntu-latest
    name: composer-audit

    env:
      COMPOSER_NO_SECURITY_BLOCKING: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      # Gate: audit the committed lock before anything rewrites it.
      - name: Composer audit
        run: composer audit --locked --abandoned=report

      # Report-only: shows advisories reachable at the lowest versions our
      # runtime constraints allow. Mostly transitive, so it never fails the build.
      - name: Composer audit (prefer-lowest, report only)
        run: |
          composer update --prefer-lowest --no-dev --prefer-dist --no-interaction --no-audit
          composer audit --no-dev --abandoned=report || echo "::warning::Advisories reachable at lowest constraints (report only)"
